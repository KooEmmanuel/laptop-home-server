# Nextcloud on your home server: four containers.
#   db     MariaDB, the database that keeps track of your files
#   redis  a cache that keeps Nextcloud quick
#   app    Nextcloud itself, on port 8080
#   cron   runs Nextcloud's background jobs
# The passwords and trusted addresses come from the .env file next to this one (make it with make-env.sh).
# Start:  docker compose up -d      Check:  docker compose ps      Update:  docker compose pull && docker compose up -d
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - ./db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
  redis:
    image: redis:alpine
    restart: unless-stopped
  app:
    image: nextcloud:stable-apache
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on: [db, redis]
    volumes:
      - ./html:/var/www/html
    environment:
      MYSQL_HOST: db
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      REDIS_HOST: redis
      NEXTCLOUD_TRUSTED_DOMAINS: ${TRUSTED}
      PHP_UPLOAD_LIMIT: 10G
      PHP_MEMORY_LIMIT: 1G
  cron:
    image: nextcloud:stable-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on: [app]
    volumes:
      - ./html:/var/www/html
